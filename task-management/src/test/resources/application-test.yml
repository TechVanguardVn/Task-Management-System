# Cấu hình riêng cho test (kích hoạt bằng @ActiveProfiles("test")).
# Không phụ thuộc file .env nên test chạy được cả trên máy CI.
# Secret dưới đây CHỈ dùng cho test, không phải secret thật.
jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1taW5pbXVtLTMyLWJ5dGVzLWxvbmc=
  expiration: 3600000

# Test KHÔNG BAO GIỜ gọi Gemini thật (kể cả khi .env của máy có AI_API_KEY); test AI dùng bản giả
ai:
  api-key: ""
  base-url: http://localhost:1
  max-requests-per-hour: 20
  max-requests-per-day: 200

spring:
  # Test luôn dùng H2 (chế độ tương thích MySQL), bỏ qua DB_URL trong .env của máy đang chạy
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    show-sql: false
