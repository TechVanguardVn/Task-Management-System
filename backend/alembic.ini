# Alembic configuration for the Task Management System backend.
# Run migrations from the backend/ directory:
#   alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# The database URL is provided at runtime by alembic/env.py, which reads
# DATABASE_URL from the root .env file. Never hardcode credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
