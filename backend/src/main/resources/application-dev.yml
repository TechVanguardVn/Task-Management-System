# Cấu hình Profile Development (Chạy nhanh tại local với H2 In-Memory)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Sử dụng H2 in-memory database để người chấm bài không cần cài Postgres vẫn chạy được ngay
    url: jdbc:h2:mem:taskmanager_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Tối ưu hóa: thiết lập kích thước batch fetch mặc định để giảm thiểu lỗi N+1 Query
        default_batch_fetch_size: 50

  data:
    redis:
      # Kết nối Redis tại local (nếu không bật Redis, hệ thống tự động fallback an toàn)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

logging:
  level:
    com.techvanguard.taskmanager: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
