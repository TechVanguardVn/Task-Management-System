# Render Blueprint: deploy PostgreSQL + 1 web service (API phục vụ luôn giao diện React).
# Dashboard Render -> New -> Blueprint -> chọn repo/nhánh -> Apply.
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow

services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    # --include=dev: cần TypeScript / Vite / Prisma CLI để build dù NODE_ENV=production
    buildCommand: >-
      cd frontend && npm ci --include=dev --no-audit --no-fund && npm run build &&
      cd ../backend && npm ci --include=dev --no-audit --no-fund && npx prisma generate && npm run build
    # Chạy migration (+ seed dữ liệu demo nếu SEED_ON_START=true) rồi khởi động server
    startCommand: cd backend && sh docker-entrypoint.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: BCRYPT_ROUNDS
        value: "12"
