name: Continuous Integration (CI Pipeline)

on:
  push:
    branches:
      - main
      - dev
      - lehuuvan-interndev
  pull_request:
    branches:
      - main
      - dev
      - lehuuvan-interndev

jobs:
  backend-test:
    name: Backend Tests & Build (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: mvn clean test

  frontend-build:
    name: Frontend Typecheck & Build (Node 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Strict Check & Vite Production Build
        working-directory: ./frontend
        run: npm run build
